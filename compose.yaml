services:
  rtems-dev:
    build:
      context: .
      dockerfile: Containerfile.ubuntu
    container_name: rtems-dev
    userns_mode: "keep-id"
    user: "builder"
    volumes:
      - /home/thomas/Projects/MCU-exp/workspace:/home/builder/workspace:z,U
    stdin_open: true
    tty: true

  renode:
    build:
      context: .
      dockerfile: Containerfile.renode
    container_name: renode-emu
    userns_mode: "keep-id"
    user: "builder"
    ports:
      - "1024:1024" # Monitor port
      - "1234:1234" # GDB port
    volumes:
      - /home/thomas/Projects/MCU-exp/workspace:/home/builder/workspace:z,U
    stdin_open: true
    tty: true

  esp32c3-dev:
    build:
      context: .
      dockerfile: Containerfile.esp32c3
      args:
        USERNAME: ${USERNAME:-builder}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: esp32c3-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-builder}"
    volumes:
      - ${ESP32C3_WORKSPACE_DIR:-./workspace/ESP32-C3}:/home/${USERNAME:-builder}/workspace:z,U
      - ${ESP32C3_FIRMWARE_DIR:-./firmware/ESP32-C3}:/home/${USERNAME:-builder}/firmware:z,U
    # Serial device exposed by the board on the host, needed for
    # `idf.py flash monitor` to work directly from inside the container.
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    stdin_open: true
    tty: true

  esp32c3-rtems-dev:
    build:
      context: .
      dockerfile: Containerfile.esp32c3-rtems
      args:
        USERNAME: ${USERNAME:-builder}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: esp32c3-rtems-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-builder}"
    volumes:
      - ${ESP32C3RTEMS_WORKSPACE_DIR:-./workspace/ESP32-C3-RTEMS}:/home/${USERNAME:-builder}/workspace:z,U
      - ${ESP32C3RTEMS_FIRMWARE_DIR:-./firmware/ESP32-C3-RTEMS}:/home/${USERNAME:-builder}/firmware:z,U
    # Flashing is done from the host directly (esptool doesn't need the RTEMS
    # toolchain), so the board's serial device isn't passed into this container.
    # Uncomment if you want to flash/monitor from inside the container instead.
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
    stdin_open: true
    tty: true

  esp32c3-rtems-dev:
    build:
      context: .
      dockerfile: Containerfile.esp32c3-rtems
      args:
        USERNAME: ${USERNAME:-builder}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: esp32c3-rtems-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-builder}"
    volumes:
      - ${ESP32C3RTEMS_WORKSPACE_DIR:-./workspace/ESP32-C3-RTEMS}:/home/${USERNAME:-builder}/workspace:z,U
      - ${ESP32C3RTEMS_FIRMWARE_DIR:-./firmware/ESP32-C3-RTEMS}:/home/${USERNAME:-builder}/firmware:z,U
    # Uncomment and adjust to the ESP32-C3's built-in USB-JTAG interface (or an
    # external probe) on the host in order to flash/debug it via OpenOCD.
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
    stdin_open: true
    tty: true

  rp2040-dev:
    build:
      context: .
      dockerfile: Containerfile.rp2040
      args:
        USERNAME: ${USERNAME:-builder}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: rp2040-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-builder}"
    volumes:
      - ${RP2040_WORKSPACE_DIR:-./workspace/RPI2040}:/home/${USERNAME:-builder}/workspace:z,U
      - ${RP2040_FIRMWARE_DIR:-./firmware/RPI2040}:/home/${USERNAME:-builder}/firmware:z,U
    # The RP2040 mounts as a USB mass storage device in BOOTSEL mode for drag-and-drop
    # UF2 flashing (usually handled from the host), and as /dev/ttyACM0 for USB-CDC
    # serial once running application firmware. Uncomment and adjust as needed.
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
    stdin_open: true
    tty: true

  rtl8720dn-dev:
    build:
      context: .
      dockerfile: Containerfile.rtl8720dn
      args:
        USERNAME: ${USERNAME:-builder}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: rtl8720dn-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-builder}"
    volumes:
      - ${RTL8720DN_WORKSPACE_DIR:-./workspace/RTL8720DN}:/home/${USERNAME:-builder}/workspace:z,U
      - ${RTL8720DN_FIRMWARE_DIR:-./firmware/RTL8720DN}:/home/${USERNAME:-builder}/firmware:z,U
    # Uncomment and adjust to the USB-serial adapter exposed by the BW16 board on
    # the host in order to flash it (e.g. via upload_image_tool_linux).
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    stdin_open: true
    tty: true

  luckfoxpico-dev:
    build:
      context: .
      dockerfile: Containerfile.luckfoxpico
      args:
        USERNAME: ${USERNAME:-builder}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: luckfoxpico-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-builder}"
    # Buildroot's SDK build needs loop-mount/chroot access to assemble rootfs images,
    # hence privileged mode (matches the vendor's documented `podman run --privileged`
    # usage). This grants the container broad host access - only use this service on
    # a trusted host.
    privileged: true
    volumes:
      - ${LUCKFOXPICO_WORKSPACE_DIR:-./workspace/Luckfoxpico}:/home/${USERNAME:-builder}/workspace:z,U
      - ${LUCKFOXPICO_FIRMWARE_DIR:-./firmware/Luckfoxpico}:/home/${USERNAME:-builder}/firmware:z,U
    stdin_open: true
    tty: true

  aim62-dev:
    build:
      context: .
      dockerfile: Containerfile.aim62
      args:
        USERNAME: ${USERNAME:-builder}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: aim62-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-builder}"
    volumes:
      - ${AIM62_WORKSPACE_DIR:-./workspace/AI-MF62-AiThinker}:/home/${USERNAME:-builder}/workspace:z,U
      - ${AIM62_FIRMWARE_DIR:-./firmware/AI-MF62-AiThinker}:/home/${USERNAME:-builder}/firmware:z,U
    # Uncomment and adjust to the USB-serial adapter exposed by the M62-M2-I-Kit on
    # the host in order to flash/monitor it.
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    stdin_open: true
    tty: true

  aim62-zephyr-dev:
    build:
      context: .
      dockerfile: Containerfile.aim62-zephyr
      args:
        USERNAME: ${USERNAME:-builder}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: aim62-zephyr-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-builder}"
    volumes:
      - ${AIM62ZEPHYR_WORKSPACE_DIR:-./workspace/AI-M62-Zephyr}:/home/${USERNAME:-builder}/workspace:z,U
      - ${AIM62ZEPHYR_FIRMWARE_DIR:-./firmware/AI-M62-Zephyr}:/home/${USERNAME:-builder}/firmware:z,U
    # Uncomment and adjust to the USB-serial adapter exposed by the M62-12F Kit on
    # the host in order to flash/monitor it via bflb_mcu_tool.
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    stdin_open: true
    tty: true
