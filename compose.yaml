services:
  rtems-dev:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    container_name: rtems-dev
    userns_mode: "keep-id"
    user: "thomas"
    volumes:
      - /home/thomas/Projects/MCU-exp/workspace:/home/thomas/workspace:z,U
    stdin_open: true
    tty: true

  renode:
    build:
      context: .
      dockerfile: Dockerfile.renode
    container_name: renode-emu
    userns_mode: "keep-id"
    user: "thomas"
    ports:
      - "1024:1024" # Monitor port
      - "1234:1234" # GDB port
    volumes:
      - /home/thomas/Projects/MCU-exp/workspace:/home/thomas/workspace:z,U
    stdin_open: true
    tty: true

  esp32c3-dev:
    build:
      context: .
      dockerfile: Dockerfile.esp32c3
      args:
        USERNAME: ${USERNAME:-thomas}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: esp32c3-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-thomas}"
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/home/${USERNAME:-thomas}/workspace:z,U
    # Uncomment and adjust to the serial device exposed by the board on the host
    # in order to flash/monitor over USB (e.g. the ESP32-C3's native USB-CDC port).
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
    stdin_open: true
    tty: true

  rp2040-dev:
    build:
      context: .
      dockerfile: Dockerfile.rp2040
      args:
        USERNAME: ${USERNAME:-thomas}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: rp2040-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-thomas}"
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/home/${USERNAME:-thomas}/workspace:z,U
    # The RP2040 mounts as a USB mass storage device in BOOTSEL mode for drag-and-drop
    # UF2 flashing (usually handled from the host), and as /dev/ttyACM0 for USB-CDC
    # serial once running application firmware. Uncomment and adjust as needed.
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
    stdin_open: true
    tty: true

  rtl8720dn-dev:
    build:
      context: .
      dockerfile: Dockerfile.rtl8720dn
      args:
        USERNAME: ${USERNAME:-thomas}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: rtl8720dn-dev
    userns_mode: "keep-id"
    user: "${USERNAME:-thomas}"
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/home/${USERNAME:-thomas}/workspace:z,U
    # Uncomment and adjust to the USB-serial adapter exposed by the BW16 board on
    # the host in order to flash it (e.g. via upload_image_tool_linux).
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    stdin_open: true
    tty: true
