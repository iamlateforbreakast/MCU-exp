name: Build AI-M62 dev image

on:
  push:
    branches:
      - main
    paths:
      - "Containerfile.aim62"
      - "compose.yaml"
      - ".github/workflows/aim62-build.yml"
  pull_request:
    paths:
      - "Containerfile.aim62"
      - "compose.yaml"
      - ".github/workflows/aim62-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build aim62-dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.aim62
          push: false
          load: true
          tags: aim62-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sanity-check toolchain and SDK inside the image
        run: |
          docker run --rm aim62-dev:ci bash -c \
            'riscv64-unknown-elf-gcc --version && test -d "$AIM62_SDK_PATH"'
