name: Build Luckfox Pico dev image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.luckfoxpico"
      - "compose.yaml"
      - ".github/workflows/luckfoxpico-build.yml"
  pull_request:
    paths:
      - "Dockerfile.luckfoxpico"
      - "compose.yaml"
      - ".github/workflows/luckfoxpico-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build luckfoxpico-dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.luckfoxpico
          push: false
          load: true
          tags: luckfoxpico-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sanity-check the dev user and tooling inside the image
        run: |
          docker run --rm luckfoxpico-dev:ci bash -c \
            'whoami && git --version && sudo -V > /dev/null'
